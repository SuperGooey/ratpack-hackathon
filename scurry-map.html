<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scurry — Rat Pack Live Map (Real NYC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- MapLibre GL JS: open-source, no API key. Same engine class as Snap Map / IG. -->
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --paper:#fbf3e2;--ground:#ece0c6;--surface:#ffffff;--surface-2:#fff8ec;--line:#e7d8ba;
    --cheese:#ffc21f;--cheese-deep:#e89e00;--pizza:#ff5436;--sewer:#3fae4e;--danger:#e23b2f;
    --pigeon:#3f8fb2;--ink:#2c2318;--muted:#8c7c64;--muted-2:#b3a489;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 80% at 15% -10%, #fff6e3 0%, transparent 55%),
      radial-gradient(120% 90% at 100% 110%, #ffe9d6 0%, transparent 50%),
      #f6ead2;
    font-family:"Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);
    display:grid;place-items:center;min-height:100%;padding:26px 14px;
  }
  .phone{
    width:392px;max-width:100%;height:812px;max-height:calc(100dvh - 40px);
    background:var(--paper);border-radius:42px;position:relative;overflow:hidden;
    box-shadow:0 30px 70px -24px rgba(120,90,40,.35), 0 0 0 10px #fff, 0 0 0 12px #e7d8ba;
    isolation:isolate;
  }

  /* ---------- status + header ---------- */
  .statusbar{position:absolute;top:0;left:0;right:0;height:46px;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 26px 0;font:700 13px "Space Mono",monospace;color:var(--ink);pointer-events:none}
  .statusbar .dots{display:flex;gap:4px;align-items:center}

  header{position:absolute;top:46px;left:0;right:0;z-index:40;padding:8px 16px 0;pointer-events:none}
  header > *{pointer-events:auto}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:9px}
  .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    background:var(--cheese);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);font-size:20px}
  .brand h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .meBtn{width:40px;height:40px;border-radius:50%;cursor:pointer;position:relative;
    background:radial-gradient(circle at 35% 30%,#c2ab92,#8a7460);
    border:2.5px solid var(--cheese);display:grid;place-items:center;font-size:20px;
    box-shadow:0 3px 10px -3px rgba(150,120,60,.4)}
  .meBtn .live{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;
    background:var(--sewer);border:2px solid var(--paper);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .search{margin-top:11px;display:flex;align-items:center;gap:9px;cursor:text;
    background:rgba(255,255,255,.9);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:14px;padding:10px 13px;
    font:400 13.5px "Bricolage Grotesque";color:var(--muted);
    box-shadow:0 4px 14px -8px rgba(150,120,60,.4)}
  .search .sniff{font-size:15px}

  .chips{margin-top:10px;display:flex;gap:8px}
  .chip{display:flex;align-items:center;gap:6px;cursor:pointer;
    padding:8px 13px;border-radius:30px;border:1px solid var(--line);
    background:rgba(255,255,255,.88);backdrop-filter:blur(8px);
    font:600 13px "Bricolage Grotesque";color:var(--muted);white-space:nowrap;
    transition:.18s ease;user-select:none;box-shadow:0 3px 10px -8px rgba(150,120,60,.4)}
  .chip .em{font-size:14px}
  .chip[data-on="1"]{color:#2c2318;border-color:transparent}
  .chip[data-on="1"][data-c="cheese"]{background:var(--cheese)}
  .chip[data-on="1"][data-c="danger"]{background:var(--danger);color:#fff}
  .chip[data-on="1"][data-c="pack"]{background:var(--ink);color:#fff7e9}

  /* ---------- map ---------- */
  #map{position:absolute;inset:0;z-index:10;background:var(--ground)}
  .maplibregl-canvas{filter:sepia(.12) saturate(1.12) brightness(1.02) hue-rotate(-6deg)}
  .maplibregl-ctrl-attrib{font-size:9px!important;background:rgba(255,255,255,.55)!important}
  .maplibregl-ctrl-bottom-right{bottom:170px!important}

  .mk{transform:translate(-50%,-50%);cursor:pointer;will-change:transform}
  .poi{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;font-size:15px;
    background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px rgba(150,120,60,.18)}
  .poi.hq{background:var(--cheese);border-color:var(--cheese-deep)}
  .poi.pizza{border-color:rgba(255,84,54,.5)}
  .poi.transit{border-color:rgba(63,143,178,.5)}
  .threat{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:14px;
    background:#fff;border:1px solid rgba(226,59,47,.5)}
  .threat.pigeon{border-color:rgba(63,143,178,.55)}
  .npc .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;position:relative;
    background:radial-gradient(circle at 35% 30%, #b59d84, #7c6650);
    border:3px solid var(--cheese);box-shadow:0 4px 12px -3px rgba(150,120,60,.35);transition:transform .12s}
  .npc:active .av{transform:scale(.92)}
  .npc[data-vibe="heat"] .av{border-color:var(--pizza)}
  .npc[data-vibe="threat"] .av{border-color:var(--danger)}
  .npc .dot{position:absolute;right:0;bottom:6px;width:13px;height:13px;border-radius:50%;
    border:2px solid var(--paper);background:var(--sewer)}
  .npc[data-vibe="heat"] .dot{background:var(--cheese)}
  .npc[data-vibe="threat"] .dot{background:var(--danger)}
  .me-mk .ring{width:58px;height:58px;border-radius:50%;padding:3px;
    background:conic-gradient(from 0deg,var(--cheese),var(--pizza),var(--sewer),var(--cheese))}
  .me-mk .inner{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:26px;
    background:radial-gradient(circle at 35% 30%,#c2ab92,#8a7460);border:3px solid var(--paper)}
  .me-mk .me{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
    font:700 9px "Space Mono",monospace;background:var(--ink);color:var(--paper);padding:2px 7px;border-radius:20px}

  #map.h-feast .grp-feast,#map.h-pack .grp-pack,#map.h-danger .grp-threat,#map.h-transit .grp-transit{display:none}

  /* ---------- right-side controls ---------- */
  .fab{position:absolute;right:14px;z-index:33;width:44px;height:44px;border-radius:14px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid var(--line);
    display:grid;place-items:center;cursor:pointer;color:var(--ink);
    box-shadow:0 8px 20px -8px rgba(150,120,60,.4)}
  .fab svg{width:20px;height:20px}
  .layersBtn{bottom:232px}
  .recenter{bottom:182px;font-size:19px}
  .layers-panel{position:absolute;right:14px;bottom:232px;z-index:34;width:186px;
    background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border:1px solid var(--line);
    border-radius:16px;padding:8px;box-shadow:0 14px 36px -14px rgba(150,120,60,.5);
    transform:translateY(8px) scale(.96);transform-origin:bottom right;opacity:0;pointer-events:none;transition:.18s ease}
  .layers-panel.show{opacity:1;transform:none;pointer-events:auto}
  .lp-ttl{font:700 9px "Space Mono",monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:6px 8px 4px}
  .lp-row{display:flex;align-items:center;gap:9px;padding:9px;border-radius:11px;cursor:pointer;font:600 13px "Bricolage Grotesque";color:var(--ink)}
  .lp-row:hover{background:var(--surface-2)}
  .lp-row .em{font-size:15px;width:18px;text-align:center}
  .lp-row .sw{margin-left:auto;width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;transition:.18s}
  .lp-row .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .lp-row[data-on="1"] .sw{background:var(--sewer)}
  .lp-row[data-on="1"] .sw::after{left:16px}
  .lp-legend{padding:8px 9px 6px;opacity:.4;transition:opacity .2s}
  .lp-legend.on{opacity:1}
  .lp-legend .bar{height:8px;border-radius:6px;background:linear-gradient(90deg,#e7d8ba,var(--cheese),var(--pizza))}
  .lp-legend .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-top:4px}

  /* ---------- bottom nav ---------- */
  .nav{position:absolute;left:0;right:0;bottom:0;z-index:52;height:88px;
    padding:12px 18px 26px;display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(0deg,var(--paper) 60%,transparent)}
  .nav button{background:none;border:none;color:var(--muted-2);font:600 9px "Bricolage Grotesque";
    display:grid;justify-items:center;gap:4px;cursor:pointer}
  .nav button .ic{font-size:20px;filter:grayscale(.4);opacity:.7}
  .nav button.active{color:var(--cheese-deep)}
  .nav button.active .ic{filter:none;opacity:1}
  .nav .center{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;
    background:var(--cheese);color:#2c2318;font-size:24px;
    box-shadow:0 6px 16px -8px rgba(232,158,0,.55);transform:translateY(-12px)}

  /* ---------- single sliding tray ---------- */
  .tray{position:absolute;left:8px;right:8px;bottom:80px;z-index:44;
    height:62vh;max-height:512px;
    background:var(--surface);border:1px solid var(--line);border-radius:24px 24px 18px 18px;
    box-shadow:0 -10px 40px -18px rgba(150,120,60,.5);
    transform:translateY(calc(100% - 78px));
    transition:transform .32s cubic-bezier(.2,.9,.3,1);
    display:flex;flex-direction:column;overflow:hidden}
  .tray.open{transform:translateY(0)}
  .tray-grip{flex:0 0 auto;padding:8px 16px 10px;cursor:grab;touch-action:none}
  .tray-grip .grab{width:38px;height:5px;border-radius:6px;background:var(--line);margin:2px auto 10px}
  .peek{display:flex;align-items:center;gap:10px;font:600 13.5px "Bricolage Grotesque";min-height:28px}
  .peek .stack{display:flex}
  .peek .stack span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;
    background:radial-gradient(circle at 35% 30%,#b59d84,#7c6650);border:2px solid var(--cheese);margin-left:-9px}
  .peek .stack span:first-child{margin-left:0}
  .peek b{color:var(--cheese-deep)}
  .peek .chev{margin-left:auto;color:var(--muted-2);font-size:15px;transition:transform .3s}
  .tray.open .peek .chev{transform:rotate(180deg)}
  .peek .backbtn{border:none;background:var(--surface-2);width:30px;height:30px;border-radius:9px;
    font-size:16px;color:var(--ink);cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
  .peek .peektitle{font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .tray-stage{position:relative;flex:1 1 auto;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;padding:2px 16px 18px;scrollbar-width:none;
    transition:transform .3s cubic-bezier(.2,.9,.3,1)}
  .view::-webkit-scrollbar{display:none}

  .tsec{font:700 9px "Space Mono",monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:8px 6px 8px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px;cursor:pointer;transition:background .15s}
  .row:hover{background:var(--surface-2)}
  .row .ravi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;flex:0 0 auto;position:relative;
    background:radial-gradient(circle at 35% 30%,#b59d84,#7c6650);border:2.5px solid var(--cheese)}
  .row[data-vibe="heat"] .ravi{border-color:var(--pizza)}
  .row[data-vibe="threat"] .ravi{border-color:var(--danger)}
  .row .rmid{flex:1;min-width:0}
  .row .rmid .rn{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px}
  .row .rmid .rl{font:400 12px "Bricolage Grotesque";color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .rright{text-align:right;flex:0 0 auto}
  .row .rright .rli{font:800 16px "Space Mono",monospace;color:var(--cheese-deep);line-height:1}
  .row .rright .rcap{font:400 8.5px "Space Mono",monospace;color:var(--muted);letter-spacing:.08em}
  .vchip{font:700 8px "Space Mono",monospace;padding:2px 6px;border-radius:20px;letter-spacing:.05em}
  .vchip.feast{background:rgba(63,174,78,.16);color:var(--sewer)}
  .vchip.heat{background:rgba(232,158,0,.18);color:var(--cheese-deep)}
  .vchip.threat{background:rgba(226,59,47,.14);color:var(--danger)}

  /* detail content (rat + place), rendered inside a view */
  .detail-head{display:flex;align-items:center;gap:13px;padding-top:6px}
  .detail-head .face{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;
    background:radial-gradient(circle at 35% 30%,#b59d84,#7c6650);border:2px solid var(--cheese);flex:0 0 auto}
  .detail-head .who{flex:1;min-width:0}
  .detail-head .who h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
  .detail-head .who .loc{font:400 12px "Bricolage Grotesque";color:var(--muted);margin-top:2px}
  .detail-head .vibe{font:700 9px "Space Mono",monospace;padding:4px 8px;border-radius:20px;letter-spacing:.08em;text-transform:uppercase;flex:0 0 auto}
  .vibe.feast{background:rgba(63,174,78,.14);color:var(--sewer);border:1px solid rgba(63,174,78,.35)}
  .vibe.heat{background:rgba(232,158,0,.16);color:var(--cheese-deep);border:1px solid rgba(232,158,0,.35)}
  .vibe.threat{background:rgba(226,59,47,.13);color:var(--danger);border:1px solid rgba(226,59,47,.35)}
  .ratebar{display:flex;align-items:center;justify-content:space-between;margin:18px 0 4px}
  .ratebar .rli{display:flex;align-items:baseline;gap:6px}
  .ratebar .rli .num{font:800 30px "Space Mono",monospace;letter-spacing:-.03em;color:var(--cheese-deep)}
  .ratebar .rli .of{font:400 12px "Space Mono",monospace;color:var(--muted)}
  .ratebar .cheese{font-size:13px;letter-spacing:1px}
  .ratebar .lbl{font:700 9px "Space Mono",monospace;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
  .breakdown{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 18px}
  .fact{display:flex;align-items:center;gap:6px;font:600 11.5px "Bricolage Grotesque";
    padding:7px 10px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
  .fact .v{font-family:"Space Mono",monospace;font-size:10.5px}
  .fact.good .v{color:var(--sewer)}
  .fact.warn .v{color:var(--cheese-deep)}
  .fact.bad .v{color:var(--danger)}
  .acts{display:flex;gap:10px}
  .acts button{flex:1;border:none;border-radius:14px;padding:14px;font:800 14px "Bricolage Grotesque";cursor:pointer}
  .acts .go{background:var(--cheese);color:#2c2318}
  .acts .wave{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .psub{font:400 12px "Bricolage Grotesque";color:var(--muted);margin-top:2px}
  .pstat{margin:16px 0;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);
    font:600 13px "Bricolage Grotesque";display:flex;align-items:center;gap:9px}
  .pstat .v{font-family:"Space Mono",monospace;color:var(--cheese-deep);margin-left:auto}

  /* ---------- full-screen section (nav tabs) ---------- */
  .screen{position:absolute;inset:0;z-index:50;background:var(--paper);
    transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
    display:flex;flex-direction:column;overflow:hidden}
  .screen.show{transform:none}
  .screen .shead{padding:56px 18px 12px;display:flex;align-items:center;gap:12px}
  .screen .shead h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;flex:1}
  .screen .shead .sub{font:400 11px "Space Mono",monospace;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  .screen .sbody{flex:1;overflow-y:auto;padding:4px 18px 110px;scrollbar-width:none}
  .screen .sbody::-webkit-scrollbar{display:none}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;
    box-shadow:0 6px 18px -12px rgba(150,120,60,.4)}
  .pcard{display:flex;align-items:center;gap:13px}
  .pcard .pav{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:0 0 auto;position:relative;
    background:radial-gradient(circle at 35% 30%,#b59d84,#7c6650);border:2.5px solid var(--cheese)}
  .pcard .pav .od{position:absolute;right:0;bottom:2px;width:12px;height:12px;border-radius:50%;background:var(--sewer);border:2px solid var(--surface)}
  .pcard[data-vibe="heat"] .pav{border-color:var(--pizza)}
  .pcard[data-vibe="threat"] .pav{border-color:var(--danger)}
  .pcard[data-vibe="threat"] .pav .od{background:var(--danger)}
  .pcard .pm{flex:1;min-width:0}
  .pcard .pm .pn{font-weight:700;font-size:15px}
  .pcard .pm .pl{font:400 12px "Bricolage Grotesque";color:var(--muted);margin-top:2px}
  .pcard .locate{border:none;background:var(--cheese);color:#2c2318;border-radius:11px;padding:9px 13px;font:800 12px "Bricolage Grotesque";cursor:pointer;flex:0 0 auto}
  .post .ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .post .ph .pav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;
    background:radial-gradient(circle at 35% 30%,#b59d84,#7c6650);border:2px solid var(--cheese)}
  .post .ph .pn{font-weight:700;font-size:14px}
  .post .ph .pt{font:400 10px "Space Mono",monospace;color:var(--muted);margin-left:auto}
  .post .pbody{font-size:14px;line-height:1.4}
  .post .pphoto{margin-top:10px;height:118px;border-radius:14px;display:grid;place-items:center;font-size:40px;
    background:linear-gradient(135deg,#fff1cf,#ffe0c4)}
  .post .pmeta{display:flex;gap:16px;margin-top:10px;font:600 12px "Bricolage Grotesque";color:var(--muted)}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px}
  .stat .k{font:700 9px "Space Mono",monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .stat .v{font:800 28px "Space Mono",monospace;letter-spacing:-.03em;color:var(--ink);margin-top:6px}
  .stat .v.up{color:var(--sewer)}
  .stat .v.cheese{color:var(--cheese-deep)}
  .bignum{background:linear-gradient(135deg,var(--cheese),var(--cheese-deep));color:#2c2318;border-radius:20px;padding:20px;margin-bottom:12px}
  .bignum .k{font:700 10px "Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
  .bignum .v{font:800 42px "Space Mono",monospace;letter-spacing:-.03em;margin-top:4px}
  .droprow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:6px 0 16px}
  .dropt{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:center;cursor:pointer;transition:.15s}
  .dropt .em{font-size:30px}
  .dropt .lab{font-weight:700;font-size:13px;margin-top:6px}
  .dropt[data-sel="1"]{border-color:var(--cheese);background:var(--surface-2)}
  .postbtn{width:100%;border:none;border-radius:14px;padding:15px;font:800 15px "Bricolage Grotesque";background:var(--cheese);color:#2c2318;cursor:pointer}

  /* search overlay */
  .searchOverlay{position:absolute;inset:0;z-index:60;background:var(--paper);
    transform:translateY(-8px);opacity:0;pointer-events:none;transition:.2s;padding:14px}
  .searchOverlay.show{opacity:1;transform:none;pointer-events:auto}
  .so-bar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:38px}
  .so-bar input{border:none;outline:none;flex:1;font:500 15px "Bricolage Grotesque";background:none;color:var(--ink)}
  .so-cancel{border:none;background:none;color:var(--cheese-deep);font:700 14px "Bricolage Grotesque";cursor:pointer}
  .so-ttl{font:700 9px "Space Mono",monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:20px 6px 8px}

    font:600 13px "Bricolage Grotesque";opacity:0;pointer-events:none;transition:.22s;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<script>
/* ============================================================
   SCURRY — real NYC map (MapLibre GL + CARTO free style, no key).
   Single sliding tray (push-navigation). Nav tabs = app sections.
   ============================================================ */

const PACK = {
  mama:{name:"Mama Gnaw",face:"🐀",photo:"assets/Sage.jpg",loc:"Mulberry St",vibe:"feast",rli:95,cheese:5,lngLat:[-73.99720,40.71960],
    facts:[["🍕","×4 · pipeline hub","good"],["🗑️","commercial bins ×6","good"],["☠️","no exterm. nearby","good"]]},
  prov:{name:"Provolone",face:"🐀",photo:"assets/Anton.jpg",loc:"Bleecker & Mott",vibe:"feast",rli:92,cheese:5,lngLat:[-73.99465,40.72575],
    facts:[["🍕","×3 slices · <1 blk","good"],["🚇","grate 40 ft","good"],["🦠","B-grade upstairs","warn"]]},
  tony:{name:"Tony Two-Tails",face:"🐀",photo:"assets/Mike.jpg",loc:"Canal St Grate",vibe:"feast",rli:88,cheese:4,lngLat:[-73.99900,40.71845],
    facts:[["🍜","C-grade · 11 violations","good"],["🚇","grate on-block","good"],["🐈","1 cat · 2 blks","warn"]]},
  slick:{name:"Slick",face:"🐀",loc:"Tompkins Sq",vibe:"heat",rli:61,cheese:3,lngLat:[-73.98160,40.72645],
    facts:[["🍕","×2 · ok","warn"],["🦅","hawk nesting","bad"],["🌳","open park · exposed","bad"]]},
  crumb:{name:"Crumb",face:"🐀",loc:"Delancey & Norfolk",vibe:"threat",rli:38,cheese:2,lngLat:[-73.98700,40.71840],
    facts:[["🕊️","pigeon flock · 1 blk","bad"],["☠️","exterminator listed","bad"],["🍕","×1 · slim","warn"]]}
};
/* Real place layers (loaded from data/places.geojson, derived from the
   Apify Google-Maps scrape + ferry docks). g = layer group. */
const GROUPS = {
  pizza:       {emoji:"🍕", color:"#ff5436", label:"Pizza"},
  bodega:      {emoji:"🏪", color:"#e89e00", label:"Bodega"},
  exterminator:{emoji:"☠️", color:"#e23b2f", label:"Exterminator"},
  warehouse:   {emoji:"📦", color:"#8a6d3b", label:"Warehouse"},
  dump:        {emoji:"🗑️", color:"#6f7d52", label:"Dump / trash"},
  ferry:       {emoji:"⛴️", color:"#3f8fb2", label:"Ferry terminal"}
};
/* which groups each toggle controls */
const TOGGLE_GROUPS = {feast:["pizza","bodega"], danger:["exterminator"], warehouse:["warehouse"], dump:["dump"], ferry:["ferry"]};
const HEAT_GROUPS = ["pizza","bodega","dump"]; // food density → rat livability proxy
const VIBE={feast:"FEAST",heat:"WATCH",threat:"CONTESTED"};
const HOME={center:[-73.9905,40.7225],zoom:13.4};
const YOU=[-73.99150,40.72180];

const map=new maplibregl.Map({container:'map',
  style:'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
  center:HOME.center,zoom:HOME.zoom,pitch:0,attributionControl:{compact:true},
  maxBounds:[[-74.30,40.45],[-73.65,40.95]]});

function el(cls,html){const d=document.createElement('div');d.className=cls;if(html!=null)d.innerHTML=html;return d;}
function addMarker(group,node,lngLat){node.classList.add(group);return new maplibregl.Marker({element:node}).setLngLat(lngLat).addTo(map);}
function avStyle(d){return d&&d.photo?`background-image:url('${d.photo}');background-size:cover;background-position:center`:'';}
function avGlyph(d){return d&&d.photo?'':'🐀';}
let toastT=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------------- TRAY: single surface, push-navigation ---------------- */
const tray=document.getElementById('tray');
const stage=document.getElementById('trayStage');
const peekEl=document.getElementById('trayPeek');
let curEl=null,curView='list',animating=false;

function listRow(d){
  const row=el('row',
    `<div class="ravi" style="${avStyle(d)}">${avGlyph(d)}</div>
     <div class="rmid"><div class="rn">${d.name} <span class="vchip ${d.vibe}">${VIBE[d.vibe]}</span></div>
       <div class="rl">📍 ${d.loc} · ${"🧀".repeat(d.cheese)}</div></div>
     <div class="rright"><div class="rli">${d.rli}</div><div class="rcap">RLI</div></div>`);
  row.dataset.vibe=d.vibe;
  row.addEventListener('click',()=>{map.flyTo({center:d.lngLat,zoom:16,duration:700});navigate('rat',d,'fwd');});
  return row;
}
function buildView(name,data){
  const v=el('view');
  if(name==='list'){
    v.appendChild(el('div','<div class="tsec">The Pack · nearby</div>').firstChild);
    Object.values(PACK).sort((a,b)=>b.rli-a.rli).forEach(d=>v.appendChild(listRow(d)));
  }else if(name==='rat'){
    const facts=data.facts.map(([em,t,k])=>`<div class="fact ${k}"><span>${em}</span><span class="v">${t}</span></div>`).join('');
    v.innerHTML=`
      <div class="detail-head">
        <div class="face" style="${avStyle(data)}">${avGlyph(data)}</div>
        <div class="who"><h2>${data.name}</h2><div class="loc">📍 ${data.loc}</div></div>
        <div class="vibe ${data.vibe}">${VIBE[data.vibe]}</div>
      </div>
      <div class="ratebar">
        <div class="rli"><span class="num">${data.rli}</span><span class="of">/100 RLI</span></div>
        <div style="text-align:right"><div class="lbl">pack rating</div><div class="cheese">${"🧀".repeat(data.cheese)+"·".repeat(5-data.cheese)}</div></div>
      </div>
      <div class="breakdown">${facts}</div>
      <div class="acts"><button class="go">Slide to this block →</button><button class="wave">Wave 🐾</button></div>`;
    v.querySelector('.go').addEventListener('click',()=>{map.flyTo({center:data.lngLat,zoom:16.5,duration:800});setOpen(false);});
    v.querySelector('.wave').addEventListener('click',()=>toast(`Waved at ${data.name} 🐾`));
  }else if(name==='place'){
    v.innerHTML=`
      <div class="detail-head">
        <div class="face">${data.emoji}</div>
        <div class="who"><h2>${data.title}</h2><div class="psub">${data.sub}</div></div>
      </div>
      <div class="pstat"><span>📈</span><span>Rat Livability</span><span class="v">${data.stat}</span></div>
      <div class="acts"><button class="go">Slide here →</button></div>`;
    v.querySelector('.go').addEventListener('click',()=>{map.flyTo({center:data.lngLat,zoom:16.5,duration:800});setOpen(false);});
  }
  return v;
}
function setPeek(name,data){
  if(name==='list'){
    peekEl.innerHTML=`<div class="stack"><span>🐀</span><span>🐀</span><span>🐀</span></div><span><b>3 of the Pack</b> nearby</span><span class="chev">⌃</span>`;
  }else{
    const title=name==='rat'?data.name:data.title;
    peekEl.innerHTML=`<button class="backbtn" type="button">←</button><span class="peektitle">${title}</span><span class="chev">⌃</span>`;
  }
}
function navigate(name,data,dir){
  if(animating)return;
  const incoming=buildView(name,data);
  stage.appendChild(incoming);
  const outgoing=curEl;
  if(outgoing){
    incoming.style.transition='none';
    incoming.style.transform=`translateX(${dir==='back'?'-100%':'100%'})`;
    void incoming.offsetWidth;                 // commit start position
    incoming.style.transition='';
    requestAnimationFrame(()=>{
      outgoing.style.transform=`translateX(${dir==='back'?'100%':'-100%'})`;
      incoming.style.transform='translateX(0)';
    });
    animating=true;
    setTimeout(()=>{if(outgoing.parentNode)outgoing.remove();animating=false;},320);
  }else{
    incoming.style.transform='translateX(0)';
  }
  curEl=incoming;curView=name;
  setPeek(name,data);
}
function setOpen(o){tray.classList.toggle('open',o);}
function openTrayTo(name,data){setOpen(true);navigate(name,data,name==='list'?'back':'fwd');}

navigate('list',null,'fwd');   // initial content

/* peek interactions: back arrow pops, rest toggles open/close */
peekEl.addEventListener('click',e=>{
  if(e.target.closest('.backbtn')){e.stopPropagation();navigate('list',null,'back');}
});
const grip=document.getElementById('trayGrip');
let sy=null,moved=0;
grip.addEventListener('pointerdown',e=>{if(e.target.closest('.backbtn'))return;sy=e.clientY;moved=0;try{grip.setPointerCapture(e.pointerId);}catch(_){}});
grip.addEventListener('pointermove',e=>{if(sy!=null)moved=e.clientY-sy;});
grip.addEventListener('pointerup',()=>{
  if(sy==null)return;
  if(Math.abs(moved)<8)tray.classList.toggle('open');
  else if(moved<0)setOpen(true); else setOpen(false);
  sy=null;
});

/* ---------------- MAP load: build layers + markers ---------------- */
map.on('load',()=>{
  // Pack avatars + YOU stay as HTML markers (photos / styled rings)
  Object.values(PACK).forEach(d=>{const n=el('mk npc',`<div class="av" style="${avStyle(d)}">${avGlyph(d)}<div class="dot"></div></div>`);n.dataset.vibe=d.vibe;n.addEventListener('click',()=>openTrayTo('rat',d));addMarker('grp-pack',n,d.lngLat);});
  addMarker('grp-me',el('mk me-mk',`<div class="ring"><div class="inner">🐀</div></div><div class="me">YOU</div>`),YOU);

  // Real places pulled from the data directory (881 points, all 5 boroughs)
  fetch('data/places.geojson').then(r=>r.json()).then(geo=>{
    map.addSource('places',{type:'geojson',data:geo});

    // Rat-heat: density of food sources (pizza + bodegas + dumps)
    map.addLayer({id:'rli-heat',type:'heatmap',source:'places',
      filter:['in',['get','g'],['literal',HEAT_GROUPS]],
      paint:{'heatmap-weight':0.8,
        'heatmap-intensity':['interpolate',['linear'],['zoom'],11,1,16,2.2],
        'heatmap-radius':['interpolate',['linear'],['zoom'],11,14,16,34],
        'heatmap-opacity':0.6,
        'heatmap-color':['interpolate',['linear'],['heatmap-density'],
          0,'rgba(255,194,31,0)',0.3,'rgba(255,194,31,0.45)',0.6,'rgba(255,138,40,0.6)',1,'rgba(255,84,54,0.78)']}});

    // Category dots (colored, clean — like a real map)
    map.addLayer({id:'places-dots',type:'circle',source:'places',
      paint:{'circle-radius':['interpolate',['linear'],['zoom'],11,3,13,4.5,14,6,16,8.5,18,12],
        'circle-color':['match',['get','g'],
          'pizza','#ff5436','bodega','#e89e00','exterminator','#e23b2f',
          'warehouse','#8a6d3b','dump','#6f7d52','ferry','#3f8fb2','#999'],
        'circle-stroke-width':1.3,'circle-stroke-color':'#fff','circle-opacity':0.9}});

    map.on('click','places-dots',e=>{
      const f=e.features[0]; if(!f)return; const p=f.properties; const g=GROUPS[p.g]||{emoji:'📍'};
      openTrayTo('place',{emoji:g.emoji,title:p.name,
        sub:(p.cat||'')+(p.addr?' · '+p.addr:''),
        stat:(p.score?('★ '+p.score):(p.cat||'')),
        lngLat:f.geometry.coordinates.slice()});
    });
    map.on('mouseenter','places-dots',()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave','places-dots',()=>map.getCanvas().style.cursor='');

    // Apply the visibility filter once the source has finished parsing, else
    // the freshly-added layers can stay un-rendered until a re-evaluation.
    if(map.isSourceLoaded('places')) applyLayers();
    else { const h=e=>{ if(e.sourceId==='places' && map.isSourceLoaded('places')){ map.off('sourcedata',h); applyLayers(); map.triggerRepaint(); } }; map.on('sourcedata',h); }
  }).catch(err=>console.error('places.geojson load failed',err));
});

/* ---------------- layer toggles ---------------- */
const mapEl=document.getElementById('map');
const lpLegend=document.getElementById('lpLegend');
function applyLayers(){
  let enabled=[];
  document.querySelectorAll('[data-key]').forEach(t=>{
    const on=t.dataset.on==="1",key=t.dataset.key;
    if(key==='pack'){mapEl.classList.toggle('h-pack',!on);}
    else if(key==='heat'){lpLegend.classList.toggle('on',on);if(map.getLayer('rli-heat'))map.setLayoutProperty('rli-heat','visibility',on?'visible':'none');}
    else if(TOGGLE_GROUPS[key]){if(on)enabled=enabled.concat(TOGGLE_GROUPS[key]);}
  });
  if(map.getLayer('places-dots'))
    map.setFilter('places-dots', enabled.length?['in',['get','g'],['literal',enabled]]:['==',['get','g'],'__none__']);
}
function bindToggle(sel){document.querySelector(sel).addEventListener('click',e=>{const t=e.target.closest('[data-key]');if(!t)return;t.dataset.on=t.dataset.on==="1"?"0":"1";applyLayers();});}
bindToggle('#chips');bindToggle('#layersPanel');

const layersPanel=document.getElementById('layersPanel');
document.getElementById('layersBtn').addEventListener('click',e=>{e.stopPropagation();layersPanel.classList.toggle('show');});
document.addEventListener('click',e=>{if(!layersPanel.contains(e.target)&&!document.getElementById('layersBtn').contains(e.target))layersPanel.classList.remove('show');});
document.getElementById('recenter').addEventListener('click',()=>map.flyTo({center:HOME.center,zoom:HOME.zoom,duration:800}));

/* ---------------- search overlay ---------------- */
const so=document.getElementById('searchOverlay');
document.getElementById('searchBar').addEventListener('click',()=>{so.classList.add('show');document.getElementById('soInput').focus();});
document.getElementById('soCancel').addEventListener('click',()=>so.classList.remove('show'));
so.addEventListener('click',e=>{
  const it=e.target.closest('.so-item');if(!it)return;
  so.classList.remove('show');
  if(it.dataset.fly){const[lng,lat,z]=it.dataset.fly.split(',').map(Number);map.flyTo({center:[lng,lat],zoom:z,duration:800});}
  if(it.dataset.open){const d=PACK[it.dataset.open];map.flyTo({center:d.lngLat,zoom:16,duration:800});setTimeout(()=>openTrayTo('rat',d),650);}
});
document.getElementById('meBtn').addEventListener('click',()=>map.flyTo({center:YOU,zoom:16,duration:700}));

/* ---------------- NAV TABS → full-screen sections ---------------- */
const screen=document.getElementById('screen');
const scrnTitle=document.getElementById('scrnTitle'),scrnSub=document.getElementById('scrnSub'),scrnBody=document.getElementById('scrnBody');
function locateRat(id){closeScreen();const d=PACK[id];map.flyTo({center:d.lngLat,zoom:16.5,duration:800});setTimeout(()=>openTrayTo('rat',d),650);}

const SCREENS={
  pack:{title:"The Pack",sub:"your crew",build(){
    let h='';
    Object.entries(PACK).forEach(([id,d])=>{
      h+=`<div class="card pcard" data-vibe="${d.vibe}">
        <div class="pav" style="${avStyle(d)}">${avGlyph(d)}<span class="od"></span></div>
        <div class="pm"><div class="pn">${d.name}</div><div class="pl">📍 ${d.loc} · ${d.rli} RLI · ${"🧀".repeat(d.cheese)}</div></div>
        <button class="locate" data-locate="${id}">Locate</button></div>`;
    });
    return h;
  }},
  slices:{title:"Slices",sub:"the feed",build(){return `
    <div class="card post"><div class="ph"><div class="pav">🐀</div><div><div class="pn">Mama Gnaw</div></div><span class="pt">2m</span></div>
      <div class="pbody">Scored a <b>whole slice</b> off Mott St. Pipeline's flowing. 🍕</div>
      <div class="pphoto">🍕</div><div class="pmeta"><span>🧀 24</span><span>💬 5</span><span>↗ share</span></div></div>
    <div class="card post"><div class="ph"><div class="pav">🐀</div><div><div class="pn">Tony Two-Tails</div></div><span class="pt">18m</span></div>
      <div class="pbody">Found a C-grade goldmine — 11 violations, zero cats. Grate's warm too. 🍜</div>
      <div class="pmeta"><span>🧀 12</span><span>💬 2</span><span>↗ share</span></div></div>
    <div class="card post"><div class="ph"><div class="pav" style="border-color:var(--danger)">🐀</div><div><div class="pn">Crumb</div></div><span class="pt">1h</span></div>
      <div class="pbody">⚠️ Pigeon flock muscling in near Delancey. Watch your turf, Pack.</div>
      <div class="pmeta"><span>🧀 31</span><span>💬 14</span><span>↗ share</span></div></div>`;
  }},
  stash:{title:"Your Stash",sub:"turf economy",build(){return `
    <div class="bignum"><div class="k">Cheese balance</div><div class="v">1,240 🧀</div></div>
    <div class="statgrid">
      <div class="stat"><div class="k">Turf owned</div><div class="v">3 blocks</div></div>
      <div class="stat"><div class="k">Pizza pipeline</div><div class="v up">+18%</div></div>
      <div class="stat"><div class="k">Routes run</div><div class="v">7</div></div>
      <div class="stat"><div class="k">Rank in Pack</div><div class="v cheese">#2</div></div>
    </div>
    <div class="tsec" style="padding-left:0">This week · P&L</div>
    <div class="card"><div style="display:flex;justify-content:space-between;font:600 13.5px 'Bricolage Grotesque'">
      <span>🍕 Slice hauls</span><span style="font-family:'Space Mono';color:var(--sewer)">+420 🧀</span></div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;font:600 13.5px 'Bricolage Grotesque'">
      <span>🗑️ Dumpster routes</span><span style="font-family:'Space Mono';color:var(--sewer)">+180 🧀</span></div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;font:600 13.5px 'Bricolage Grotesque'">
      <span>🕊️ Turf lost to pigeons</span><span style="font-family:'Space Mono';color:var(--danger)">−95 🧀</span></div></div>`;
  }},
  drop:{title:"Drop a Slice",sub:"report to the map",build(){return `
    <p style="color:var(--muted);font-size:13.5px;margin:0 0 6px">Tag what you spotted at your block. The Pack sees it live.</p>
    <div class="droprow">
      <div class="dropt" data-sel="1" data-kind="🍕 Slice"><div class="em">🍕</div><div class="lab">Slice / Feast</div></div>
      <div class="dropt" data-kind="🗑️ Haul"><div class="em">🗑️</div><div class="lab">Dumpster Haul</div></div>
      <div class="dropt" data-kind="☠️ Threat"><div class="em">☠️</div><div class="lab">Threat</div></div>
      <div class="dropt" data-kind="🕊️ Pigeon"><div class="em">🕊️</div><div class="lab">Pigeon Sighting</div></div>
    </div>
    <button class="postbtn" id="postBtn">Post to the map 📍</button>`;
  }}
};
function openScreen(key){
  const s=SCREENS[key];if(!s)return;
  scrnTitle.textContent=s.title;scrnSub.textContent=s.sub;scrnBody.innerHTML=s.build();
  screen.classList.add('show');
  scrnBody.querySelectorAll('[data-locate]').forEach(b=>b.addEventListener('click',()=>locateRat(b.dataset.locate)));
  const drops=scrnBody.querySelectorAll('.dropt');
  drops.forEach(d=>d.addEventListener('click',()=>{drops.forEach(x=>x.dataset.sel="0");d.dataset.sel="1";}));
  const pb=scrnBody.querySelector('#postBtn');
  if(pb)pb.addEventListener('click',()=>{const sel=scrnBody.querySelector('.dropt[data-sel="1"]');closeScreen();toast(`Dropped ${sel?sel.dataset.kind:'a pin'} — the Pack can see it`);});
}
function closeScreen(){screen.classList.remove('show');}
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const tab=b.dataset.tab;
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
  if(tab==='map'){closeScreen();document.querySelector('.nav [data-tab="map"]').classList.add('active');}
  else if(tab==='drop'){openScreen('drop');}      // center FAB: create, no persistent tab highlight
  else{b.classList.add('active');openScreen(tab);}
});
</script>
</body>
</html>
